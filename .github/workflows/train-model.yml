# Train a reproducible model and commit model.json for the static Vercel site.
name: Train BuildSense AI model

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-model.yml"
      - "training/train.py"
      - "training/requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install archive tool
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip

      - name: Install training dependencies
        run: python -m pip install -r training/requirements.txt

      - name: Download the published dataset
        run: |
          mkdir -p /tmp/buildsense-download data/concrete_cracks/raw
          curl -fL --retry 3 --retry-delay 2 \
            "https://md-datasets-cache-zipfiles-prod.s3.eu-west-1.amazonaws.com/5y9wdsg2zt-2.zip" \
            -o /tmp/buildsense-download/dataset.zip
          unzip -o /tmp/buildsense-download/dataset.zip -d /tmp/buildsense-download
          7z x "/tmp/buildsense-download/Concrete Crack Images for Classification.rar" \
            -o"data/concrete_cracks/raw" -y

      - name: Train PCA, LDA and neural network
        run: |
          python training/train.py \
            --data-dir data/concrete_cracks/raw \
            --image-size 32 \
            --max-per-class 1500 \
            --components 40 \
            --output model.json

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json
          if git diff --cached --quiet; then
            echo "Trained model is unchanged."
          else
            git commit -m "Add trained BuildSense AI model"
            git push
          fi
